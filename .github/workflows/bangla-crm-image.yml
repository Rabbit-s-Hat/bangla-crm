name: Bangla CRM image

# Builds the all-in-one image (server + front end, bn-BD compiled) and pushes it to GHCR.
# Run manually from the Actions tab, or push a tag like `bangla-v0.1.0`.
# Upstream Twenty workflows are not meant to run in this fork; this one is self-contained.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 0.1.0). "latest" is always added too.'
        required: true
        default: 'dev'
  push:
    tags:
      - 'bangla-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: bangla-crm-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Rabbit-s-Hat/bangla-crm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#bangla-v}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/rabbit-s-hat/bangla-crm" >> "$GITHUB_OUTPUT"

      # The front-end build needs ~8 GB of Node heap; reclaim runner disk for the image layers.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Rabbit-s-Hat/bangla-crm
            org.opencontainers.image.description=Bangla CRM — a Bangla-first build of Twenty (AGPL-3.0). Source: https://github.com/Rabbit-s-Hat/bangla-crm
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
