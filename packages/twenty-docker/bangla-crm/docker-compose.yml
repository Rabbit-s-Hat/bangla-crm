# Bangla CRM — Bangla-first build of Twenty (AGPL-3.0). Source: https://github.com/Rabbit-s-Hat/bangla-crm
#
# Do not edit this file to configure your installation: put settings in `.env` (created by the installer).
# Commands (run in this folder):  docker compose up -d   |   docker compose stop   |   docker compose ps
#
# Cloud servers also load docker-compose.cloud.yml (Caddy + HTTPS) through COMPOSE_FILE in `.env`.

name: bangla-crm

# Settings shared by the server and the worker. Anything else (email/SMTP, Google/Microsoft sign-in,
# AI providers) is configured in the app: Settings -> Admin Panel -> Config Variables / AI.
x-bangla-crm-env: &bangla-crm-env
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD is missing from .env - run the installer}@db:5432/${PG_DATABASE_NAME:-default}
  REDIS_URL: redis://redis:6379
  SERVER_URL: ${SERVER_URL:-http://localhost:3000}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is missing from .env - run the installer}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
  APP_SECRET: ${APP_SECRET:-}
  STORAGE_TYPE: local
  IS_MULTIWORKSPACE_ENABLED: "false"
  IS_CONFIG_VARIABLES_IN_DB_ENABLED: "true"
  # Sender name of system emails (password reset, verification). A value saved in the
  # Admin Panel takes precedence over this default.
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bangla CRM}

services:
  server:
    image: ghcr.io/rabbit-s-hat/bangla-crm:${TAG:-latest}
    # The image is built for x86-64 only; Apple Silicon Macs run it through emulation.
    platform: linux/amd64
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      # 127.0.0.1 = this computer only. Set BIND_ADDRESS=0.0.0.0 in .env to share on your office network.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    environment:
      <<: *bangla-crm-env
      NODE_PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # First start creates the database and runs migrations (up to ~15 min on slow computers).
      # Failures during start_period are not counted; a success marks the server healthy at once.
      start_period: 30m
    restart: unless-stopped

  worker:
    image: ghcr.io/rabbit-s-hat/bangla-crm:${TAG:-latest}
    platform: linux/amd64
    command: ["yarn", "worker:prod"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      <<: *bangla-crm-env
      DISABLE_DB_MIGRATIONS: "true" # the server runs them
      DISABLE_CRON_JOBS_REGISTRATION: "true" # the server registers them
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD is missing from .env - run the installer}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  server-local-data:
